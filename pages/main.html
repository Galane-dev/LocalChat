<!DOCTYPE html>
<html>
    <head>
        <title>Main | LocalChat</title>
    </head>
    <body>
        <header>

        </header>

        <nav>
            <div>
                <H2 id="text-logo">LocalChat</H2>
                <img id="profile-icon" src="profile-icon.png" alt="profile icon"/>
            </div>

            <div>
                <div id="search-container">
                    <input id="search-text" type="text" placeholder="Search"/>
                    <img id="search-icon" type="text" alt="search-icon"/>
                </div>
            </div>

            <div>
                <ul id="filter-tags">
                    <li id="filter-tag-all">All</li>
                    <li id="filter-tag-online">Online</li>
                    <li id="filter-tag-groups">Groups</li>
                    <li id="filter-tag-unread">Unread</li>
                </ul>
            </div>

            <div>
                <ul id="users-list">

                </ul>
            </div>

        </nav>

        <main>
            <div>
                <img id="chatee-profile-picture" src="" alt="chatee profile picture"/>
                <p id="chatee-name"></p>
                <p id="chatee-status"></p>
            </div>

            <div id="messages-box">
                <ul id="chats-list"></ul>
                <p id="no-messages">No messages yet...</p>
            </div>

            <div id="message-container">
                <input id="message-text" type="text" placeholder="Type here..."/>
                <img id="message-send" type="text" alt="send-icon"/>
                
            </div>
            
        </main>

        <aside>
            <div>
                <h2>Profile</h2>
            </div>

            <div id="current-user">
                <img id="user-profile-picture"/>
                <label for="username-input">Username</label>
                <input id="username-input" type="text"/>
                <label for="password-input">Password</label>
                <input for="password-input" type="password"/>

                <button id="cancel-edits">Cancel Edits</button>
                <button id="save-edits">Save Edits</button>

            </div>

            <div id="chatee">
                <img id="chatee-side-profile-picture"/>
                <h3 id="chatee-side-name"></h3>
                <p id="chatee-last-seen"></p>
            </div>
            

        </aside>



        <script type="module" src="../js/main-page.js"></script>
    </body>
</html>
