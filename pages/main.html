<!DOCTYPE html>
<html>
    <head>
        <title>Main | LocalChat</title>
        <link href="../styles/main-page.css" rel="stylesheet"/>
    </head>
    <body>
        <header>

        </header>

        <nav>
            <div id="nav-appbar">
                <H2 id="text-logo">Local<span>Chat</span></H2>
                <div>
                    <img id="add-group-icon" class="icon" src="../assets/images/icons/add.png" alt="add group icon"/>
                    <img id="profile-icon" class="icon" src="../assets/images/icons/profile.png" alt="profile icon"/>
                </div>
                
            </div>

            <div>
                <div id="search-container">
                    <input id="search-text" type="text" placeholder="Search"/>
                    <img id="search-icon" class="icon" src="../assets/images/icons/search.png" alt="search-icon"/>
                </div>
            </div>

            <div id="filters-div">
                <ul id="filter-tags">
                    <li id="filter-tag-all">All</li>
                    <li id="filter-tag-online">Online</li>
                    <li id="filter-tag-groups">Groups</li>
                    <li id="filter-tag-unread">Unread</li>
                </ul>
            </div>

            <div>
                <ul id="users-list">

                </ul>

               

                <p id="no-users">No or groups users found</p>
            </div>

        </nav>

        <main>
            <div id="chatee-info">
                <img id="chatee-profile-picture" src="../assets/images/icons/image.png" alt="chatee profile picture"/>
                <h3 id="chatee-name"></h3>
                <p id="chatee-status"></p>
            </div>

            <div id="messages-box">
                <ul id="chats-list"></ul>
                <p id="no-messages">No messages yet...</p>
            </div>

            <div id="message-container">
                <input id="message-text" type="text" placeholder="Type here..."/>
                <img id="message-send" src="../assets/images/icons/send.png" alt="send-icon"/>
                
            </div>
            
        </main>

        <aside>
            <div id="profile-appbar">
                <h2>Profile</h2>
            </div>

            <div id="current-user">
                <div id="current-user-details">
                    <img id="user-profile-picture" src="../assets/images/icons/image.png"/>
                    <label for="username-input">Username</label>
                    <input id="username-input" type="text"/>
                    <label for="password-input">Password</label>
                    <input id="password-input" type="password"/>

                    <div id="profile-actions">
                        <button id="cancel-edits">Cancel Edits</button>
                        <button id="save-edits">Save Edits</button>
                        <button id="logout">Log out</button>
                    </div>
                    
                </div>
                

            </div>

            <div id="chatee">
                <div id="chatee-details">
                    <img id="chatee-side-profile-picture" src="../assets/images/icons/image.png"/>
                    <h3 id="chatee-side-name">Click a profile to see name</h3>
                    <p id="chatee-side-status">Click a profile to see status</p>
                </div>
                
            </div>
            

        </aside>



        <script type="module" src="../js/main-page.js"></script>
    </body>
</html>
